name: Terraform Bootstrap

on:
  pull_request:
    paths:
      - backend/infra/bootstrap/**
      - .github/workflows/terraform-bootstrap.yml
  push:
    branches:
      - main
    paths:
      - backend/infra/bootstrap/**
      - .github/workflows/terraform-bootstrap.yml

concurrency:
  group: terraform-bootstrap-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate Bootstrap
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/infra/bootstrap
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

  plan:
    name: Plan Bootstrap
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TERRAFORM_BOOTSTRAP_READY == 'true'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: backend/infra/bootstrap
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.TERRAFORM_BOOTSTRAP_PLAN_ROLE_ARN }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Render Plan
        run: terraform show -no-color tfplan > plan.txt

      - name: Comment Plan
        uses: actions/github-script@v7
        env:
          PLAN_FILE: backend/infra/bootstrap/plan.txt
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-bootstrap-plan -->';
            let plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const limit = 60000;
            if (plan.length > limit) {
              plan = `${plan.slice(0, limit)}\n...\n[truncated]`;
            }

            const body = [
              marker,
              '## Terraform Bootstrap Plan',
              '',
              `Repository: ${context.repo.owner}/${context.repo.repo}`,
              `Ref: ${context.payload.pull_request.head.ref}`,
              '',
              '<details><summary>terraform show -no-color tfplan</summary>',
              '',
              '```text',
              plan,
              '```',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  apply:
    name: Apply Bootstrap
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TERRAFORM_BOOTSTRAP_READY == 'true'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: backend/infra/bootstrap
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.TERRAFORM_BOOTSTRAP_APPLY_ROLE_ARN }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: |
          set -o pipefail
          terraform apply -input=false -auto-approve -no-color | tee apply.txt

      - name: Comment Apply Result
        uses: actions/github-script@v7
        env:
          APPLY_FILE: backend/infra/bootstrap/apply.txt
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-bootstrap-apply -->';
            let applyResult = fs.readFileSync(process.env.APPLY_FILE, 'utf8');
            const limit = 60000;
            if (applyResult.length > limit) {
              applyResult = `${applyResult.slice(0, limit)}\n...\n[truncated]`;
            }

            const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            const body = [
              marker,
              '## Terraform Bootstrap Apply',
              '',
              `Commit: ${context.sha}`,
              '',
              '<details><summary>terraform apply</summary>',
              '',
              '```text',
              applyResult,
              '```',
              '</details>',
            ].join('\n');

            for (const pr of associated.data) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              });

              const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body,
                });
              }
            }
