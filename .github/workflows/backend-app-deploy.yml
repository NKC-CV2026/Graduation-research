name: Backend App Deploy

on:
  pull_request:
    paths:
      - backend/app/**
      - .github/workflows/backend-app-deploy.yml
  push:
    branches:
      - main
    paths:
      - backend/app/**
      - .github/workflows/backend-app-deploy.yml
  workflow_dispatch:

concurrency:
  group: backend-app-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate Backend App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/app/go.mod
          cache: true
          cache-dependency-path: backend/app/go.sum

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Go Build
        run: go build ./cmd/api ./cmd/migrate

      - name: Docker Build
        run: docker buildx build --platform linux/amd64 --provenance=false -t local/backend-app:check .

  deploy-dev:
    name: Build Push Deploy Dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.BACKEND_APP_READY == 'true'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.TERRAFORM_BOOTSTRAP_APPLY_ROLE_ARN }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        working-directory: backend/app
        env:
          IMAGE_URI: ${{ vars.BACKEND_APP_ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}
        run: |
          docker buildx build --platform linux/amd64 --provenance=false -t "$IMAGE_URI" --push .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init Dev
        working-directory: backend/infra/env/dev
        run: terraform init -input=false

      - name: Terraform Apply Dev
        working-directory: backend/infra/env/dev
        run: terraform apply -input=false -auto-approve -no-color -var "app_image_uri=${{ vars.BACKEND_APP_ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}"

      - name: Capture Terraform Outputs
        id: tf
        working-directory: backend/infra/env/dev
        run: |
          echo "cluster_name=$(terraform output -raw ecs_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "task_definition_arn=$(terraform output -raw migration_task_definition_arn)" >> "$GITHUB_OUTPUT"
          echo "container_name=$(terraform output -raw migration_task_container_name)" >> "$GITHUB_OUTPUT"
          echo "subnet_ids=$(terraform output -json private_subnet_ids | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"
          echo "security_group_id=$(terraform output -raw app_security_group_id)" >> "$GITHUB_OUTPUT"
          echo "lambda_function_name=$(terraform output -raw lambda_function_name)" >> "$GITHUB_OUTPUT"
          echo "api_endpoint=$(terraform output -raw http_api_endpoint)" >> "$GITHUB_OUTPUT"

      - name: Run Migration Task
        id: run-task
        env:
          SUBNET_IDS: ${{ steps.tf.outputs.subnet_ids }}
          SECURITY_GROUP_ID: ${{ steps.tf.outputs.security_group_id }}
          CLUSTER_NAME: ${{ steps.tf.outputs.cluster_name }}
          TASK_DEFINITION_ARN: ${{ steps.tf.outputs.task_definition_arn }}
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER_NAME" \
            --launch-type FARGATE \
            --task-definition "$TASK_DEFINITION_ARN" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_IDS],securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          aws ecs wait tasks-stopped --cluster "$CLUSTER_NAME" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER_NAME" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          test "$EXIT_CODE" = "0"

      - name: Comment Deploy Result
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- backend-app-deploy -->';
            const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            const body = [
              marker,
              '## Backend App Deploy',
              '',
              `Image: ${process.env.IMAGE_URI}`,
              `Migration task: ${process.env.TASK_ARN}`,
              `Migration exit code: ${process.env.EXIT_CODE}`,
              `Lambda: ${process.env.LAMBDA_FUNCTION_NAME}`,
              `API: ${process.env.API_ENDPOINT}`,
            ].join('\n');

            for (const pr of associated.data) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              });
              const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body,
                });
              }
            }
        env:
          IMAGE_URI: ${{ vars.BACKEND_APP_ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}
          TASK_ARN: ${{ steps.run-task.outputs.task_arn }}
          EXIT_CODE: ${{ steps.run-task.outputs.exit_code }}
          LAMBDA_FUNCTION_NAME: ${{ steps.tf.outputs.lambda_function_name }}
          API_ENDPOINT: ${{ steps.tf.outputs.api_endpoint }}
